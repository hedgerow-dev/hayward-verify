name: New uploads (dry run)

# Every 6 hours, scan model repos changed on the Hub since the last fully
# successful run, in 8 shards. Nothing is signed or published. Flagged repos go
# only into the age-encrypted review report, as in the main scan.
#
# The list window starts at the watermark from the last successful run, minus
# 30 minutes. With no watermark, it falls back to the last 6 hours plus that
# overlap. At most 2,400 repos are listed, oldest first; anything newer stays
# in front of the watermark for the next run. The watermark job publishes the
# new mark only after every scan shard succeeds.
on:
  schedule:
    # 01:47, 07:47, ...: clear of the main scan at :17 every 6 hours, which shares
    # the Hugging Face token and its rate limit.
    - cron: "47 1-23/6 * * *"

permissions: {}

concurrency:
  group: new-uploads
  cancel-in-progress: false

jobs:
  # Hub listing, plus a read of this repo's last successful run. No Hugging Face token:
  # the automatic token is limited to actions: read, for the watermark artifact.
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - run: python verify_service.py list-new --hours 6 --out new.json --window-out watermark.json --from-actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-list
          path: new.json
          retention-days: 3
          if-no-files-found: error
      # The proposed mark. It counts only once the watermark job republishes it,
      # which does not run unless every scan shard succeeded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window
          path: watermark.json
          retention-days: 3
          if-no-files-found: error

  # Reads untrusted model files, so it holds only the read-only Hugging Face token, in
  # the same locked-down per-repo containers as the main scan.
  scan:
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: docker build --pull -t hayward-verify-scanner:local .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: new-list
          path: .
      # Shorter than the job's limit, so the report upload below still runs.
      - name: Scan this shard
        timeout-minutes: 270
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: python verify_service.py scan --repos new.json --shard "$SHARD/8" --out out
      # age-encrypted to the reviewer's key, so safe in a public repo's artifacts.
      # Uploaded even when the scan step fails or times out: it holds what was found.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: withheld-${{ matrix.shard }}
          path: withheld.json.age
          retention-days: 30
          if-no-files-found: error

  # The run's watermark. needs: success, so a failed list or any failed shard leaves
  # the previous mark in place and the next run repeats that window.
  watermark:
    needs: [list, scan]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: window
          path: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watermark
          path: watermark.json
          retention-days: 90
          if-no-files-found: error
